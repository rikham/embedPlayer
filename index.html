<!DOCTYPE html>
<html>
<body style="background-color:black;color:white;display:flex;flex-direction:column;justify-content:center;align-items:center;height:100vh;margin:0;font-family:sans-serif;text-align:center;">
    
    <h1>Get Ready...</h1>
    <p>Opening Spotify</p>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const spotId = urlParams.get('v'); // We'll keep the 'v' parameter name for simplicity

        if (spotId) {
            setTimeout(() => {
                // This attempts to open the Spotify App directly (deep link)
                // If the app isn't installed, it falls back to the web player
                window.location.href = `spotify:track:${spotId}`;
                
                // Backup redirect for browsers that don't support deep links
                setTimeout(() => {
                    window.location.href = `https://open.spotify.com/track/${spotId}`;
                }, 500);
            }, 2000);
        } else {
            document.body.innerHTML = "<h1>Error: No Spotify ID</h1>";
        }
    </script>
</body>
</html>
