<!DOCTYPE html>
<html>
<head>
    <title>Rockster Player</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://www.youtube.com/iframe_api"></script>
</head>
<body style="background-color:black;color:white;display:flex;flex-direction:column;justify-content:center;align-items:center;height:100vh;margin:0;font-family:sans-serif;overflow:hidden;">
    
    <div id="loading-screen" style="text-align:center;">
        <h1>Get Ready...</h1>
        <p>Flip your phone over!</p>
    </div>

    <div id="player" style="position:absolute; top:0; left:0; width:100%; height:100%; visibility:hidden;"></div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const ytId = urlParams.get('v');
        let player;

        // This function is called automatically by the YouTube API
        function onYouTubeIframeAPIReady() {
            if (!ytId) {
                document.getElementById('loading-screen').innerText = "Error: No Song ID";
                return;
            }

            player = new YT.Player('player', {
                height: '100%',
                width: '100%',
                videoId: ytId,
                playerVars: {
                    'autoplay': 1,
                    'controls': 0,
                    'modestbranding': 1,
                    'rel': 0,      // Don't show related videos
                    'iv_load_policy': 3, // Hide annotations
                    'playsinline': 1
                },
                events: {
                    'onReady': onPlayerReady,
                    'onStateChange': onPlayerStateChange
                }
            });
        }

        function onPlayerReady(event) {
            // Wait 2 seconds before showing the video and playing
            setTimeout(() => {
                document.getElementById('loading-screen').style.display = 'none';
                document.getElementById('player').style.visibility = 'visible';
                event.target.playVideo();
            }, 2000);
        }

        function onPlayerStateChange(event) {
            // If the video ends (State 0), seek back to start and play again
            if (event.data === YT.PlayerState.ENDED) {
                player.seekTo(0);
                player.playVideo();
            }
        }
    </script>
</body>
</html>
